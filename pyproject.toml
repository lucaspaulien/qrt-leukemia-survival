[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amlrisk"
version = "0.1.0"
description = "Overall-survival risk model for myeloid leukemia patients (QRT x Gustave Roussy data challenge): karyotype parsing, IPSS-M features, IPCW multi-horizon boosting and a leave-centers-out validation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lucas Paulien" }]
keywords = ["survival-analysis", "machine-learning", "c-index", "xgboost", "healthcare", "data-challenge"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "scikit-survival>=0.22",
    "xgboost>=2.0",
    "lightgbm>=4.0",
]

[project.urls]
Repository = "https://github.com/lucaspaulien/qrt-leukemia-survival"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "matplotlib>=3.7", "pyflakes>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
